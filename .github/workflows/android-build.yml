# Builds the TinyNudge Android app (Trusted Web Activity) with Bubblewrap.
# Run it by hand: GitHub > Actions > "Android build (TWA)" > Run workflow.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64       base64 of the upload keystore (scripts/android/generate-keystore.sh prints it)
#   BUBBLEWRAP_KEYSTORE_PASSWORD  keystore password
#   BUBBLEWRAP_KEY_PASSWORD       key password (same value as the keystore password for a PKCS12 keystore)
#
# Output: workflow artifacts "tinynudge-android-<versionCode>" containing app-release-bundle.aab
# (upload this to Play Console) and app-release-signed.apk (for side-loading / testing).

name: Android build (TWA)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "appVersionCode (integer, must be higher than the last one uploaded to Play)"
        required: true
        default: "1"
      version_name:
        description: "Version name shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
      TARGET_SDK: "36"
      # Bubblewrap 1.27 builds with exactly this build-tools version.
      BUILD_TOOLS: "36.1.0"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check secrets are set
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"; missing=1; }
          [ -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" ] || { echo "::error::Secret BUBBLEWRAP_KEYSTORE_PASSWORD is not set"; missing=1; }
          [ -n "$BUBBLEWRAP_KEY_PASSWORD" ] || { echo "::error::Secret BUBBLEWRAP_KEY_PASSWORD is not set"; missing=1; }
          exit $missing

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails: Google no longer publishes the legacy "tools" package.
          packages: platform-tools

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-${TARGET_SDK}" "build-tools;${BUILD_TOOLS}"
          yes | sdkmanager --licenses > /dev/null || true
          # Older Bubblewrap checks for the legacy "tools" folder; point it at the current cmdline-tools.
          if [ ! -e "$ANDROID_HOME/tools" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Pre-seed Bubblewrap config (no interactive JDK/SDK download prompts)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android.keystore
          keytool -list -v -keystore android.keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep -E "Alias name|SHA256:" || {
            echo "::error::Could not open the keystore. Check ANDROID_KEYSTORE_BASE64 and BUBBLEWRAP_KEYSTORE_PASSWORD."; exit 1; }

      - name: Set version
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          case "$VERSION_CODE" in ''|*[!0-9]*) echo "::error::version_code must be a whole number"; exit 1;; esac
          jq --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" \
            '.appVersionCode = $code | .appVersion = $name' twa-manifest.json > twa-manifest.tmp
          mv twa-manifest.tmp twa-manifest.json
          jq '{packageId, host, startUrl, appVersionCode, appVersion, targetSdkVersion}' twa-manifest.json

      - name: Check the website serves the icons and manifest
        run: |
          failed=0
          for url in $(jq -r '.iconUrl, .maskableIconUrl, .webManifestUrl | select(. != null)' twa-manifest.json); do
            if curl -sfIL -o /dev/null "$url"; then
              echo "OK  $url"
            else
              echo "::error::$url is not reachable. Deploy the website (firebase deploy --only hosting) before building the Android app."
              failed=1
            fi
          done
          exit $failed

      - name: Generate Android project from twa-manifest.json
        run: bubblewrap update --skipVersionUpgrade --manifest ./twa-manifest.json < /dev/null

      - name: Check version in the generated project
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          grep -q "versionName \"$VERSION_NAME\"" app/build.gradle || {
            echo "::error::app/build.gradle does not have versionName \"$VERSION_NAME\""; grep -n "versionName" app/build.gradle; exit 1; }
          grep -qE "versionCode ${VERSION_CODE}([^0-9]|$)" app/build.gradle || {
            echo "::error::app/build.gradle does not have versionCode $VERSION_CODE"; grep -n "versionCode" app/build.gradle; exit 1; }

      - name: Enforce target SDK ${{ env.TARGET_SDK }} (current Google Play requirement)
        run: |
          gradle_file=app/build.gradle
          sed -i -E "s/(compileSdkVersion|compileSdk)([ =]+)[0-9]+/\1\2${TARGET_SDK}/" "$gradle_file"
          sed -i -E "s/(targetSdkVersion|targetSdk)([ =]+)[0-9]+/\1\2${TARGET_SDK}/" "$gradle_file"
          grep -nE "compileSdk|targetSdk|minSdk|versionCode|versionName|applicationId" "$gradle_file"

      - name: Build signed AAB and APK
        run: bubblewrap build --skipPwaValidation --manifest ./twa-manifest.json < /dev/null

      - name: Print fingerprint for assetlinks.json
        run: |
          echo "Upload key SHA-256 (put this AND the Play 'App signing key' SHA-256 in public/.well-known/assetlinks.json):"
          keytool -list -v -keystore android.keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep "SHA256:"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tinynudge-android-${{ inputs.version_code }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f android.keystore
