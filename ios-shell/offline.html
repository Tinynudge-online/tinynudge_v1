<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ec4899">
  <title>TinyNudge — You're offline</title>
  <!--
    Bundled inside the iOS app (Capacitor server.errorPath). Shown when
    https://www.tinynudge.online can't be reached. Must stay self-contained:
    no external CSS, fonts or images, because there is no network here.
  -->
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #fdf2f8 0%, #fce7f3 50%, #f5f3ff 100%);
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-user-select: none;
      user-select: none;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.15);
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ec4899, #a855f7);
    }
    h1 { font-size: 22px; margin: 0 0 8px; color: #be185d; }
    p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; color: #6b7280; }
    .status { font-size: 13px; margin: 16px 0 0; min-height: 1.5em; }
    button {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 9999px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(90deg, #ec4899, #a855f7);
      cursor: pointer;
      min-width: 160px;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.7; }
    button:focus-visible { outline: 3px solid #f9a8d4; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="#ffffff">
        <path d="M12 21s-6.7-4.35-9.33-8.5C.9 9.7 2.1 5.5 6 5.5c2.1 0 3.4 1.2 4 2.2h.01C10.6 6.7 11.9 5.5 14 5.5h0c3.9 0 5.1 4.2 3.33 7C18.7 16.65 12 21 12 21z" transform="translate(1 0)"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>TinyNudge needs an internet connection to load tonight's nudge. Check your connection and try again.</p>
    <button type="button" id="retry">Try again</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      var SITE = 'https://www.tinynudge.online/';
      var button = document.getElementById('retry');
      var status = document.getElementById('status');

      function retry() {
        if (navigator.onLine === false) {
          status.textContent = 'Still no connection. We’ll reconnect as soon as you’re back online.';
          return;
        }
        button.disabled = true;
        status.textContent = 'Reconnecting…';
        window.location.replace(SITE);
        // If the site is still unreachable the app shows this page again.
        setTimeout(function () { button.disabled = false; }, 4000);
      }

      button.addEventListener('click', retry);
      window.addEventListener('online', retry);
    })();
  </script>
</body>
</html>
