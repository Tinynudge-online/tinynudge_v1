<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ec4899">
  <title>TinyNudge — You're offline</title>
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #fdf2f8 0%, #fce7f3 50%, #f5f3ff 100%);
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.15);
    }
    .icon { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 16px; display: block; }
    h1 { font-size: 22px; margin: 0 0 8px; color: #be185d; }
    p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; color: #6b7280; }
    button {
      appearance: none;
      border: 0;
      border-radius: 9999px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(90deg, #ec4899, #a855f7);
      cursor: pointer;
      min-width: 160px;
    }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 3px solid #f9a8d4; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/icons/icon-192.png" alt="TinyNudge" width="72" height="72">
    <h1>You're offline</h1>
    <p>TinyNudge needs an internet connection to load tonight's nudge. Check your connection and try again.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { window.location.reload(); });
    window.addEventListener('online', function () { window.location.reload(); });
  </script>
</body>
</html>
